name: xnu-4903 (iOS 12 kernel)

on:
  workflow_dispatch:
    inputs:
      xnu_tag:
        description: "xnu tag"
        default: "xnu-4903.270.47"
      machine_config:
        description: "MACHINE_CONFIG (BCM2837 = Cortex-A53, S5L8960X = A7)"
        default: "BCM2837"
      kernel_config:
        description: "KERNEL_CONFIG"
        default: "DEVELOPMENT"
      runner:
        description: "macOS runner image"
        default: "macos-15-intel"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Restore the previous try's sources, host tools and compiled objects, so
      # this try recompiles only what changed (minutes instead of ~25).
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work
            !work/build/xnu.dst
            !work/build/xnu.sym
            !work/build/dtrace.obj
            !work/build/fh.obj
            !work/xnu-staged
          key: xnu-work-${{ inputs.runner }}-${{ inputs.machine_config }}-${{ github.run_id }}
          restore-keys: xnu-work-${{ inputs.runner }}-${{ inputs.machine_config }}-

      - name: Build
        env:
          XNU_TAG: ${{ inputs.xnu_tag }}
          MACHINE_CONFIG: ${{ inputs.machine_config }}
          KERNEL_CONFIG: ${{ inputs.kernel_config }}
        run: bash scripts/build-xnu-4903.sh

      # Save even when the build failed: failed tries are the ones we resume from.
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work
            !work/build/xnu.dst
            !work/build/xnu.sym
            !work/build/dtrace.obj
            !work/build/fh.obj
            !work/xnu-staged
          key: xnu-work-${{ inputs.runner }}-${{ inputs.machine_config }}-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.machine_config }}-${{ inputs.kernel_config }}
          path: logs/

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.machine_config }}-${{ inputs.kernel_config }}
          path: out/
          if-no-files-found: ignore
